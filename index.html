<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David's Programming Solutions</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1d2433;--muted:#5d6678;--accent:#4f46e5;--accent2:#e0e7ff;--line:#e3e6ee;--ok:#15803d;--bad:#b91c1c;--con:#0f1420;--conink:#d7e0f5}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:32px 20px}
header .w,main{max-width:900px;margin:0 auto}
header h1{margin:0 0 6px;font-size:1.7rem}
header p{margin:0;opacity:.9}
nav{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
nav .w{max-width:900px;margin:0 auto;display:flex;gap:6px;padding:10px 20px;overflow-x:auto}
nav button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent2);color:var(--accent)}
main{padding:24px 20px 60px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
h2{margin:0 0 10px;font-size:1.3rem}
h3{margin:0 0 10px;font-size:1.02rem}
.ex{display:inline-block;background:var(--bg);border-radius:8px;padding:3px 10px;margin:2px 4px 2px 0;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:#fafbff}
summary{cursor:pointer;font-weight:600;color:var(--accent)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:8px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
pre{margin:0;background:var(--con);color:var(--conink);padding:16px;border-radius:10px;overflow-x:auto;font-family:ui-monospace,Consolas,monospace;font-size:.88rem;line-height:1.5}
.copy{margin-top:8px;border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input[type=text]{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
.run{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.alt{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.console{background:var(--con);color:var(--conink);border-radius:10px;padding:16px;font-family:ui-monospace,Consolas,monospace;font-size:.95rem;white-space:pre-wrap;margin-top:10px}
.console .in{color:#7dd3fc}.console .out{color:#86efac}
.console .t{color:#8b97b5;display:block;margin-bottom:8px;font-size:.8rem}
.note{color:var(--muted);font-size:.9rem}
.steps li{margin:4px 0}
.hint{color:#b45309}
</style>
</head>
<body>
<header><div class="w"><h1>Programming Solutions for David</h1><p>Questions 1 to 3: code, explanations, hints and a live tester for each test value.</p></div></header>
<nav><div class="w" id="nav"></div></nav>
<main id="main"></main>

<script>
const Q=[
{
 id:1,title:"Question 1: Summing a number's digits",
 task:"Write a program which asks the user for a number, then returns the sum of the absolute value of each of the number's decimal digits.",
 examples:["10 → 1","99 → 18","-32 → 5"],
 tests:["123","-54"],
 hints:[
  ["Hint 1: Absolute","The absolute value ignores the sign, so -32 becomes 32. In C# use Math.Abs(number). In Python use abs(number). Do this first, before touching the digits."],
  ["Hint 2: Remainder and division","number % 10 gives the last digit (123 % 10 = 3). number / 10 (integer division) removes it (123 → 12). Repeat in a while loop until the number reaches 0, adding each last digit to a running total."]
 ],
 how:["Read the number from the user.","Take its absolute value so negatives become positive.","While the number is greater than 0: add number % 10 to the sum, then do number = number / 10.","Print the sum."],
 cs:`using System;

class Program
{
    static void Main()
    {
        Console.Write("Enter a number: ");
        int number = int.Parse(Console.ReadLine());

        number = Math.Abs(number);   // ignore the sign
        int sum = 0;

        while (number > 0)
        {
            sum += number % 10;      // add the last digit
            number /= 10;            // remove the last digit
        }

        Console.WriteLine("Sum of digits: " + sum);
    }
}`,
 py:`number = int(input("Enter a number: "))

number = abs(number)   # ignore the sign
total = 0

while number > 0:
    total += number % 10   # add the last digit
    number //= 10          # remove the last digit

print("Sum of digits:", total)`,
 prompt:"Enter a number: ",
 run:s=>{const n=parseInt(s,10);if(isNaN(n))return null;let a=Math.abs(n),t=0;while(a>0){t+=a%10;a=Math.floor(a/10)}return "Sum of digits: "+t}
},
{
 id:2,title:"Question 2: Check if a number is a palindrome",
 task:"A number is a palindrome if it stays the same when its digits are reversed (5, 44, 171, 4884 are; 43, 194, 4773 are not). Write a program which takes a positive integer and returns whether or not it is a palindrome.",
 examples:["44 → palindrome","171 → palindrome","194 → not a palindrome"],
 tests:["12321","123421"],
 hints:[
  ["Hint: Remainder and division","Build the reversed number digit by digit: reversed = reversed * 10 + number % 10, then number = number / 10. Keep a copy of the original number so you can compare at the end."]
 ],
 how:["Read the positive integer and store a copy in original.","Start reversed at 0.","While number is greater than 0: reversed = reversed * 10 + number % 10, then number = number / 10.","If original equals reversed, it is a palindrome. Otherwise it is not."],
 cs:`using System;

class Program
{
    static void Main()
    {
        Console.Write("Enter a positive integer: ");
        int number = int.Parse(Console.ReadLine());

        int original = number;       // keep a copy to compare later
        int reversed = 0;

        while (number > 0)
        {
            reversed = reversed * 10 + number % 10;
            number /= 10;
        }

        if (original == reversed)
            Console.WriteLine(original + " is a palindrome");
        else
            Console.WriteLine(original + " is not a palindrome");
    }
}`,
 py:`number = int(input("Enter a positive integer: "))

original = number      # keep a copy to compare later
reversed_num = 0

while number > 0:
    reversed_num = reversed_num * 10 + number % 10
    number //= 10

if original == reversed_num:
    print(original, "is a palindrome")
else:
    print(original, "is not a palindrome")`,
 prompt:"Enter a positive integer: ",
 run:s=>{const n=parseInt(s,10);if(isNaN(n)||n<0)return null;let a=n,r=0;while(a>0){r=r*10+a%10;a=Math.floor(a/10)}return n+(n===r?" is a palindrome":" is not a palindrome")}
},
{
 id:3,title:"Question 3: Reverse the words in a sentence",
 task:"Write a program that asks the user for a sentence, then returns the sentence with the words in reverse order.",
 examples:["you're just as sane as I am → am I as sane as just you're"],
 tests:["fame is a fickle friend","are you as clever as I am"],
 hints:[
  ["Hint: Splitting the sentence","Split the sentence at each space to get an array of words, reverse the array, then join the words back together with a space between them."]
 ],
 how:["Read the sentence from the user.","Split it into words at the spaces (ignoring empty entries from double spaces).","Reverse the order of the words.","Join them back into one string with single spaces and print it."],
 cs:`using System;

class Program
{
    static void Main()
    {
        Console.Write("Enter a sentence: ");
        string sentence = Console.ReadLine();

        string[] words = sentence.Split(' ', StringSplitOptions.RemoveEmptyEntries);
        Array.Reverse(words);

        Console.WriteLine("Reversed: " + string.Join(" ", words));
    }
}`,
 py:`sentence = input("Enter a sentence: ")

words = sentence.split()      # split on spaces
words.reverse()               # reverse the order

print("Reversed:", " ".join(words))`,
 prompt:"Enter a sentence: ",
 run:s=>{const w=s.split(" ").filter(x=>x);if(!w.length)return null;return "Reversed: "+w.reverse().join(" ")}
}
];

const nav=document.getElementById("nav"),main=document.getElementById("main");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function consoleBlock(q,val){
 const r=q.run(val);
 return `<span class="t">Console output</span>${esc(q.prompt)}<span class="in">${esc(val)}</span>\n<span class="out">${r===null?"Invalid input. Please try again.":esc(r)}</span>`;
}
Q.forEach((q,i)=>{
 const b=document.createElement("button");b.textContent="Question "+q.id;b.onclick=()=>show(i);nav.appendChild(b);
 const s=document.createElement("section");s.id="s"+i;
 s.innerHTML=`
 <div class="card"><h2>${q.title}</h2><p>${q.task}</p><div>${q.examples.map(e=>`<span class="ex">${esc(e)}</span>`).join("")}</div></div>
 <div class="card"><h3>Hints</h3>${q.hints.map(h=>`<details><summary class="hint">${h[0]}</summary><p>${h[1]}</p></details>`).join("")}</div>
 <div class="card"><h3>How it works</h3><ol class="steps">${q.how.map(x=>`<li>${x}</li>`).join("")}</ol></div>
 <div class="card"><h3>Solution code</h3>
  <div class="tabs"><button class="on" data-l="cs">C#</button><button data-l="py">Python</button></div>
  <pre></pre><button class="copy">Copy code</button></div>
 <div class="card"><h3>Test results (for your screenshot)</h3>
  <p class="note">These are the exact test values from the question. Use the same code in your own editor and screenshot your own program running, as the task asks.</p>
  ${q.tests.map(t=>`<div class="console">${consoleBlock(q,t)}</div>`).join("")}</div>
 <div class="card"><h3>Try your own input</h3><div class="row"><input type="text" placeholder="Type an input"><button class="run">Run</button></div><div class="console" style="display:none"></div></div>`;
 main.appendChild(s);
 let lang="cs";const pre=s.querySelector("pre");
 const draw=()=>pre.textContent=q[lang];draw();
 s.querySelectorAll(".tabs button").forEach(bt=>bt.onclick=()=>{lang=bt.dataset.l;s.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===bt));draw()});
 s.querySelector(".copy").onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(q[lang]);e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy code",1200)};
 const inp=s.querySelector("input"),out=s.querySelectorAll(".console");const last=out[out.length-1];
 const go=()=>{last.style.display="block";last.innerHTML=consoleBlock(q,inp.value)};
 s.querySelector(".run").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
});
function show(i){document.querySelectorAll("section").forEach((x,j)=>x.classList.toggle("on",i===j));[...nav.children].forEach((x,j)=>x.classList.toggle("on",i===j));window.scrollTo(0,0)}
show(0);
</script>
</body>
</html>
