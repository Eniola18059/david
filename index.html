<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Color by Code: Adding Integers – Answer Key</title>
<style>
:root{--bg:#fbf7f0;--card:#fff;--text:#2a2430;--muted:#6b6475;--line:#e4dccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1822;--card:#27222f;--text:#f1ecf5;--muted:#a79fb2;--line:#3a3344}}
:root[data-theme="dark"]{--bg:#1c1822;--card:#27222f;--text:#f1ecf5;--muted:#a79fb2;--line:#3a3344}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip.on{border-color:var(--text)}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.3);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative}
.card.done{opacity:.45}
.sw{height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600}
.expr{font-size:1.1rem;font-weight:600}
.ans{color:var(--muted);font-size:.9rem}
.note{margin-top:22px;color:var(--muted);font-size:.9rem}
.prog{margin:0 0 14px;font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>🎃 Color by Code: Adding Integers</h1>
<p class="sub">Answer key. Tap a color to filter, tap a problem to mark it colored.</p>
<div class="chips" id="chips"></div>
<p class="prog" id="prog"></p>
<div class="grid" id="grid"></div>
<p class="note">Some labels are small in the photo. The purple piece on the far left may read 9 + 6 (= 15, purple). Check it against the paper.</p>
</main>
<script>
var COLORS={"-3":["orange","#f28c28"],"15":["purple","#7b4fb8"],"-1":["pink","#f48fb1"],"3":["black","#222"],"0":["white","#fff"],"-5":["gray","#9a9a9a"],"8":["yellow","#f6d530"],"-8":["blue","#4a7fd4"]};
var P=[["8 + 0",8],["3 + 5",8],["9 + -1",8],["12 + -4",8],["-8 + 16",8],
["1 + -4",-3],["-3 + 0",-3],["-5 + 2",-3],["3 + -6",-3],["-4 + 1",-3],["6 + -9",-3],["0 + -3",-3],
["8 + 7",15],["10 + 5",15],["4 + 11",15],["16 + -1",15],["20 + -5",15],["9 + 6 (?)",15],
["1 + 2",3],["3 + 0",3],["5 + -2",3],["9 + -6",3],["4 + -1",3],["8 + -5",3],["-4 + 7",3],["-1 + 4",3],["6 + -3",3],
["-8 + 0",-8],["-7 + -1",-8],["-3 + -5",-8],["8 + -16",-8],
["4 + -5",-1],["5 + -6",-1],["1 + -2",-1],
["4 + -9",-5],
["3 + -3",0]];
var order=[8,-3,15,3,-8,-1,-5,0],sel=null,done={};
var chips=document.getElementById("chips"),grid=document.getElementById("grid"),prog=document.getElementById("prog");
function render(){
chips.innerHTML="";
[null].concat(order).forEach(function(k){
var b=document.createElement("button");b.className="chip"+(sel===k?" on":"");
b.innerHTML=k===null?"All":'<span class="dot" style="background:'+COLORS[k][1]+'"></span>'+COLORS[k][0]+" ("+k+")";
b.onclick=function(){sel=k;render()};chips.appendChild(b)});
grid.innerHTML="";var n=0,d=0;
order.forEach(function(k){P.forEach(function(p,i){
if(p[1]!==k)return;n++;var id=p[0];if(done[id])d++;
if(sel!==null&&sel!==k)return;
var c=document.createElement("div");c.className="card"+(done[id]?" done":"");
var fg=(k===3||k===-8||k===15)?"#fff":"#222";
c.innerHTML='<div class="sw" style="background:'+COLORS[k][1]+';color:'+fg+'">'+(done[id]?"✓ ":"")+COLORS[k][0]+'</div><div class="expr">'+p[0]+'</div><div class="ans">= '+k+'</div>';
c.onclick=function(){done[id]=!done[id];render()};grid.appendChild(c)})});
prog.textContent=d+" of "+n+" problems marked colored"}
render();
</script>
</body>
</html>
